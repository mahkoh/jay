[package]
name = "codegen"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.10.1", default-features = false }
permutation = { version = "0.4.1", default-features = false }
anyhow = { version = "1.0.103", default-features = false, features = ["std"] }
indexmap = { version = "2.14.0", default-features = false, features = ["std"] }
regex = { version = "1.12.4", default-features = false, features = ["std", "unicode-perl"] }
linearize = { version = "0.1.7", default-features = false, features = ["derive"] }
kbvm = { version = "0.1.7", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
with_builtin_macros = { version = "0.1.0", default-features = false }
uapi = { version = "0.2.13", default-features = false }
rayon = { version = "1.11.0", default-features = false }
walkdir = { version = "2.5.0", default-features = false }
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
blake3 = { version = "1.8.6", default-features = false }
isnt = { version = "0.2.0", default-features = false }
