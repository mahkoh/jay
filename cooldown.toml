[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "ignore"

[registry]
global-min-publish-age = "14 days"

[[allow.package]]
min-publish-age = "0"
crates = [
    "jay-ash",
    "uapi",
    "uapi-proc",
    "linearize",
    "linearize-derive",
    "dlopen-note",
    "kbvm",
    "kbvm-proc",
]
